<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>Sebá Map 🌴</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --sea: #0e7c86; --sea-deep: #0a4f5c; --foam: #e6f6f4;
  --sand: #fff6e6; --sand-2: #f6e3c3; --coral: #ff6b4a; --sun: #ffc23d;
  --leaf: #2f9e5b; --ink: #17323a; --muted: #5d7479;
  --card: rgba(255, 252, 245, .94); --shadow: 0 10px 30px rgba(10, 79, 92, .18);
  --r: 22px;
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font-family: 'DM Sans', system-ui, sans-serif; color: var(--ink); background: var(--foam); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
#map { position: fixed; inset: 0; background: #aad3df; }
.leaflet-tile-pane { filter: saturate(1.15) hue-rotate(-6deg) brightness(1.03); }
.leaflet-control-attribution { font-size: 10px; }

/* Header */
.hud { position: fixed; z-index: 500; top: calc(12px + var(--safe-t)); left: 12px; right: 12px; display: grid; gap: 8px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.brand { background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: var(--r); padding: 12px 16px 14px; box-shadow: var(--shadow); }
.brand-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
h1 { font-family: 'Fraunces', serif; font-weight: 800; font-size: 22px; margin: 0; letter-spacing: -.02em; color: var(--sea-deep); }
h1 small { font-family: 'DM Sans'; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.count { font-weight: 700; font-size: 13px; color: var(--sea); white-space: nowrap; }
.bar { position: relative; height: 12px; margin-top: 8px; border-radius: 99px; background: var(--sand-2); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sea), #19b3a5 60%, var(--sun)); transition: width .6s cubic-bezier(.2, .9, .3, 1.3); }
.bar i::after { content: '🏄'; position: absolute; right: -6px; top: -6px; font-size: 16px; }
.msg { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 1em; }

.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--card); backdrop-filter: blur(10px); padding: 9px 14px; border-radius: 99px; font-size: 14px; font-weight: 500; box-shadow: 0 4px 14px rgba(10, 79, 92, .14); }
.chip[aria-pressed="true"] { background: var(--sea-deep); color: #fff; }

/* Markers */
.pin { position: relative; width: 40px; height: 40px; border-radius: 50% 50% 50% 6px; transform: rotate(-45deg); display: grid; place-items: center; box-shadow: 0 6px 14px rgba(0, 0, 0, .25); border: 3px solid #fff; transition: transform .2s; }
.pin span { transform: rotate(45deg); font-size: 19px; line-height: 1; }
.pin--praia { background: var(--sun); }
.pin--trilha { background: var(--leaf); }
.pin--cachoeira { background: #3fa7e0; }
.pin.on { transform: rotate(-45deg) scale(1.25); }
.pin.done { background: #cfd8d6; filter: grayscale(1); opacity: .6; }
.pin.done::after { content: '✓'; position: absolute; transform: rotate(45deg); top: -8px; right: -8px; width: 18px; height: 18px; border-radius: 50%; background: var(--leaf); color: #fff; font: 700 12px/18px 'DM Sans'; text-align: center; filter: none; }

/* Sheet (list + detail) */
.sheet { position: fixed; z-index: 600; left: 0; right: 0; bottom: 0; background: var(--sand); border-radius: var(--r) var(--r) 0 0; box-shadow: 0 -10px 30px rgba(10, 79, 92, .2); display: flex; flex-direction: column; height: 72vh; height: 72dvh; transform: translateY(calc(100% - 132px - var(--safe-b))); transition: transform .35s cubic-bezier(.2, .9, .3, 1); }
.sheet.open { transform: none; }
.handle { padding: 10px 16px 6px; text-align: left; width: 100%; }
.handle::before { content: ''; display: block; width: 44px; height: 5px; border-radius: 9px; background: var(--sand-2); margin: 0 auto 10px; }
.handle b { font-family: 'Fraunces'; font-size: 18px; }
.handle span { color: var(--muted); font-size: 13px; margin-left: 6px; }
.search { margin: 4px 16px 10px; padding: 12px 14px; border-radius: 14px; border: 2px solid var(--sand-2); background: #fff; font: inherit; font-size: 16px; width: calc(100% - 32px); }
.search:focus { outline: none; border-color: var(--sea); }
.list { list-style: none; margin: 0; padding: 0 12px calc(16px + var(--safe-b)); overflow-y: auto; flex: 1; }
.item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px; border-radius: 16px; text-align: left; }
.item:hover, .item:focus-visible { background: #fff; outline: none; }
.dot { flex: none; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; }
.dot--praia { background: #ffe7a8; } .dot--trilha { background: #c9efd6; } .dot--cachoeira { background: #cfe9f8; }
.item .t { font-weight: 700; display: block; }
.item .s { font-size: 13px; color: var(--muted); }
.item.done .t { text-decoration: line-through; text-decoration-color: var(--leaf); text-decoration-thickness: 2px; color: var(--muted); }
.item.done .dot { filter: grayscale(1); opacity: .55; }
.item .ok { margin-left: auto; color: var(--leaf); font-weight: 700; }
.empty { text-align: center; color: var(--muted); padding: 24px; }

/* Detail card */
.card { position: fixed; z-index: 700; left: 10px; right: 10px; bottom: calc(10px + var(--safe-b)); background: var(--sand); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; transform: translateY(120%); transition: transform .35s cubic-bezier(.2, .9, .3, 1.15); }
.card.show { transform: none; }
.card-top { padding: 18px 18px 14px; color: #fff; position: relative; }
.card-top.praia { background: linear-gradient(135deg, #12a5a0, var(--sea-deep)); }
.card-top.trilha { background: linear-gradient(135deg, #3cb371, #1f6b46); }
.card-top.cachoeira { background: linear-gradient(135deg, #48b4ea, #1c5f8f); }
.card-top::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 14px; background: radial-gradient(14px 10px at 14px 0, transparent 98%, var(--sand)) repeat-x; background-size: 28px 14px; }
.kind { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
.card h2 { font-family: 'Fraunces'; font-size: 26px; margin: 4px 40px 0 0; line-height: 1.1; }
.close { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255, 255, 255, .22); color: #fff; font-size: 20px; }
.card-body { padding: 10px 18px 18px; }
.card-body p { margin: 0 0 10px; line-height: 1.45; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.tags span { font-size: 12.5px; padding: 5px 10px; border-radius: 99px; background: var(--sand-2); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { padding: 14px; border-radius: 16px; font-weight: 700; text-align: center; text-decoration: none; font-size: 15px; }
.btn--go { background: #fff; color: var(--sea-deep); border: 2px solid var(--sand-2); }
.btn--done { background: var(--coral); color: #fff; box-shadow: 0 6px 0 #d94b2c; transition: transform .1s, box-shadow .1s; }
.btn--done:active { transform: translateY(4px); box-shadow: 0 2px 0 #d94b2c; }
.btn--done.is { background: var(--leaf); box-shadow: 0 6px 0 #1f6b46; }

.fab { position: fixed; z-index: 550; right: 12px; bottom: calc(146px + var(--safe-b)); width: 48px; height: 48px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); font-size: 20px; }

/* Confetti */
.boom { position: fixed; z-index: 900; pointer-events: none; font-size: 22px; left: 50%; top: 60%; animation: boom 1.1s ease-out forwards; }
@keyframes boom { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }

/* Desktop */
@media (min-width: 820px) {
  .hud { left: 16px; right: auto; width: 360px; top: 16px; }
  .sheet { left: 16px; right: auto; bottom: 16px; width: 360px; top: 196px; height: auto; border-radius: var(--r); transform: none; }
  .handle { pointer-events: none; }
  .handle::before { display: none; }
  .card { left: auto; right: 16px; bottom: 16px; width: 380px; }
  .fab { right: 16px; bottom: auto; top: 16px; }
  .fab.up { top: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa de São Sebastião"></div>

<header class="hud">
  <div class="brand">
    <div class="brand-row">
      <h1>Sebá Map 🌴<small>São Sebastião</small></h1>
      <span class="count" id="count"></span>
    </div>
    <div class="bar" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div>
    <div class="msg" id="msg"></div>
  </div>
  <nav class="chips" aria-label="Filtros">
    <button class="chip" data-f="todos" aria-pressed="true">🗺️ Todos</button>
    <button class="chip" data-f="praia" aria-pressed="false">🏖️ Praias</button>
    <button class="chip" data-f="trilha" aria-pressed="false">🥾 Trilhas & cachoeiras</button>
    <button class="chip" id="hideDone" aria-pressed="false">🙈 Esconder visitados</button>
  </nav>
</header>

<section class="sheet" id="sheet">
  <button class="handle" id="handle" aria-expanded="false"><b>Lugares</b><span id="sub"></span></button>
  <input class="search" id="q" type="search" placeholder="Buscar praia ou trilha…" autocomplete="off">
  <ul class="list" id="list"></ul>
</section>

<button class="fab" id="locate" aria-label="Onde estou">📍</button>

<article class="card" id="card" aria-live="polite"></article>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const CITY = 'sao-sebastiao';
const EMOJI = { praia: '🏖️', trilha: '🥾', cachoeira: '💧' };
const KIND = { praia: 'Praia', trilha: 'Trilha', cachoeira: 'Cachoeira' };
const KEY = 'seba-map:visited';
const spots = SPOTS.filter(s => s.cidade === CITY);
const $ = id => document.getElementById(id);

let visited;
try { visited = new Set(JSON.parse(localStorage.getItem(KEY)) || []); } catch { visited = new Set(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...visited])); } catch {} };

let filter = 'todos', hideDone = false, query = '', current = null;
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const matches = s =>
  (filter === 'todos' || (filter === 'praia' ? s.tipo === 'praia' : s.tipo !== 'praia')) &&
  !(hideDone && visited.has(s.id)) &&
  (!query || norm(s.nome + ' ' + s.tags.join(' ')).includes(query));

// Map
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([-23.79, -45.6], 11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
map.fitBounds(L.latLngBounds(spots.map(s => [s.lat, s.lng])), innerWidth >= 820 ? { paddingTopLeft: [400, 30], paddingBottomRight: [30, 30] } : { paddingTopLeft: [10, 170], paddingBottomRight: [10, 150] });

const markers = {};
const icon = s => L.divIcon({
  className: '', iconSize: [40, 40], iconAnchor: [20, 40],
  html: `<div class="pin pin--${s.tipo}${visited.has(s.id) ? ' done' : ''}${current === s.id ? ' on' : ''}"><span>${EMOJI[s.tipo]}</span></div>`
});
spots.forEach(s => {
  markers[s.id] = L.marker([s.lat, s.lng], { icon: icon(s), title: s.nome, keyboard: true })
    .on('click', () => open(s.id)).addTo(map);
});

function render() {
  // markers
  spots.forEach(s => {
    const m = markers[s.id];
    m.setIcon(icon(s));
    if (matches(s) || !query && current === s.id) m.addTo(map); else m.remove();
  });
  // list
  const shown = spots.filter(matches).sort((a, b) => visited.has(a.id) - visited.has(b.id) || b.lng - a.lng);
  $('list').innerHTML = shown.length ? shown.map(s => `
    <li><button class="item${visited.has(s.id) ? ' done' : ''}" data-id="${s.id}">
      <span class="dot dot--${s.tipo}">${EMOJI[s.tipo]}</span>
      <span><span class="t">${s.nome}</span><span class="s">${KIND[s.tipo]} · ${s.tags.join(' · ')}</span></span>
      ${visited.has(s.id) ? '<span class="ok">✓</span>' : ''}
    </button></li>`).join('') : '<li class="empty">Nada por aqui 🐚</li>';
  $('sub').textContent = `${shown.length} no mapa`;
  // progress
  const done = spots.filter(s => visited.has(s.id)).length, pct = Math.round(done / spots.length * 100);
  $('count').textContent = `${done} de ${spots.length} · ${pct}%`;
  $('fill').style.width = pct + '%';
  document.querySelector('.bar').setAttribute('aria-valuenow', pct);
  $('msg').textContent =
    pct === 100 ? '🏆 Lenda de São Sebastião! Hora de atravessar pra Ilhabela.' :
    pct >= 75 ? '🔥 Reta final, faltam poucas!' :
    pct >= 50 ? '🌊 Metade do litoral desbravado!' :
    pct >= 25 ? '🐢 Já é quase local, hein?' :
    done ? '🌱 Começou bem! Bora pra próxima.' : 'Toque num pin e marque onde você já foi ✨';
}

function open(id) {
  const s = spots.find(x => x.id === id);
  current = id;
  const done = visited.has(id);
  $('card').innerHTML = `
    <div class="card-top ${s.tipo}">
      <div class="kind">${EMOJI[s.tipo]} ${KIND[s.tipo]}</div>
      <h2>${s.nome}</h2>
      <button class="close" aria-label="Fechar">×</button>
    </div>
    <div class="card-body">
      <p>${s.desc}</p>
      <div class="tags">${s.tags.map(t => `<span>${t}</span>`).join('')}</div>
      <div class="actions">
        <a class="btn btn--go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">🧭 Como chegar</a>
        <button class="btn btn--done${done ? ' is' : ''}" id="toggle">${done ? '✅ Já fui!' : 'Já fui! ✅'}</button>
      </div>
    </div>`;
  $('card').classList.add('show');
  $('sheet').classList.remove('open');
  $('handle').setAttribute('aria-expanded', false);
  map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 13), { duration: .6 });
  render();
}
function close() { current = null; $('card').classList.remove('show'); render(); }

function toggle() {
  const id = current;
  if (visited.has(id)) visited.delete(id); else { visited.add(id); boom(); }
  save(); open(id);
}

function boom() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const bits = ['🎉', '🐚', '🌊', '⭐', '🌴', '🐠', '☀️'];
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('span');
    el.className = 'boom';
    el.textContent = bits[i % bits.length];
    const a = Math.random() * Math.PI * 2, d = 120 + Math.random() * 180;
    el.style.setProperty('--x', Math.cos(a) * d + 'px');
    el.style.setProperty('--y', Math.sin(a) * d - 120 + 'px');
    el.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1200);
  }
  navigator.vibrate?.(30);
}

// Events
$('card').addEventListener('click', e => {
  if (e.target.closest('.close')) close();
  else if (e.target.closest('#toggle')) toggle();
});
$('list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) open(b.dataset.id); });
$('handle').addEventListener('click', () => {
  const o = $('sheet').classList.toggle('open');
  $('handle').setAttribute('aria-expanded', o);
  if (o) $('card').classList.remove('show');
});
$('q').addEventListener('focus', () => { $('sheet').classList.add('open'); $('card').classList.remove('show'); });
$('q').addEventListener('input', e => { query = norm(e.target.value.trim()); render(); });
document.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
  filter = b.dataset.f;
  document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));
$('hideDone').addEventListener('click', e => {
  hideDone = !hideDone;
  e.currentTarget.setAttribute('aria-pressed', hideDone);
  e.currentTarget.textContent = hideDone ? '👀 Mostrar visitados' : '🙈 Esconder visitados';
  render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
map.on('click', () => { if (current) close(); });

let me;
$('locate').addEventListener('click', () => {
  if (!navigator.geolocation) return alert('Seu navegador não tem localização 😕');
  navigator.geolocation.getCurrentPosition(p => {
    const ll = [p.coords.latitude, p.coords.longitude];
    me?.remove();
    me = L.circleMarker(ll, { radius: 9, color: '#fff', weight: 3, fillColor: '#ff6b4a', fillOpacity: 1 }).addTo(map).bindTooltip('Você está aqui');
    map.flyTo(ll, 14);
  }, () => alert('Não consegui pegar sua localização 😕'), { enableHighAccuracy: true, timeout: 10000 });
});

render();
</script>
</body>
</html>
